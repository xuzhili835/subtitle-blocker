<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4b5563;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:0.7" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角正方形 -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGradient)"/>

  <!-- 视频播放器框架 -->
  <rect x="48" y="64" width="160" height="90" rx="6" fill="#111827" stroke="#374151" stroke-width="2"/>

  <!-- 视频内容区域 -->
  <rect x="54" y="70" width="148" height="78" rx="4" fill="#1f2937"/>

  <!-- 模拟视频画面 -->
  <rect x="62" y="78" width="40" height="24" rx="2" fill="#374151"/>
  <rect x="106" y="78" width="40" height="24" rx="2" fill="#374151"/>
  <rect x="150" y="78" width="40" height="24" rx="2" fill="#374151"/>

  <!-- 字幕线条（被遮挡） -->
  <g opacity="0.6">
    <rect x="62" y="116" width="50" height="3" rx="1.5" fill="#9ca3af"/>
    <rect x="116" y="116" width="60" height="3" rx="1.5" fill="#9ca3af"/>
  </g>

  <!-- 半透明遮挡条 -->
  <rect x="56" y="108" width="144" height="24" rx="4" fill="url(#blockGradient)" filter="url(#shadow)"/>

  <!-- 遮挡条纹理 -->
  <g opacity="0.3">
    <line x1="56" y1="120" x2="200" y2="120" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- 装饰元素 - 播放按钮 -->
  <circle cx="128" cy="95" r="8" fill="#6b7280" opacity="0.5"/>
  <path d="M124 91 L124 99 L132 95 Z" fill="#9ca3af"/>

  <!-- 底部装饰 -->
  <rect x="80" y="170" width="96" height="4" rx="2" fill="#4b5563"/>
  <rect x="100" y="180" width="56" height="4" rx="2" fill="#4b5563"/>

  <!-- 顶部高光 -->
  <ellipse cx="128" cy="40" rx="60" ry="12" fill="#ffffff" opacity="0.08"/>
</svg>